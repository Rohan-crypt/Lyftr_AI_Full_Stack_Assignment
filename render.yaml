services:
  - type: web
    name: lyftr-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_API_KEYS
        sync: false
    disk:
      name: sqlite-data
      mountPath: /app/backend/data
      sizeGB: 1

  - type: web
    name: lyftr-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: lyftr-backend
          property: host
